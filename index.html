<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aplikasi HMSI</title>
  <style>
    :root {
      --color-bg: #0F172A;
      --color-card: #1E293B;
      --color-red: #DC2626;
      --color-yellow: #EAB308;
      --color-text: #F8FAFC;
      --color-muted: #94A3B8;
      --color-green: #16A34A;
      --color-secondary-btn: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Container ukuran layar mobile agar 100% sama seperti di Android */
    #rootContainer {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--color-bg);
      padding: 24px 18px 40px 18px;
      display: flex;
      flex-direction: column;
    }

    .login-wrapper {
      padding: 56px 10px 24px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      background-color: var(--color-card);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .card.red-card {
      background-color: var(--color-red);
    }

    .item-box {
      background-color: var(--color-bg);
      padding: 12px;
      margin: 5px 0;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }

    .label {
      padding: 3px 0;
      line-height: 1.4;
      white-space: pre-line;
      word-break: break-word;
    }

    .input-field {
      width: 100%;
      background-color: var(--color-bg);
      color: var(--color-text);
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 14px;
      margin: 5px 0;
      font-size: 14px;
      outline: none;
    }

    .input-field::placeholder {
      color: var(--color-muted);
    }

    .input-field:focus {
      border-color: var(--color-yellow);
    }

    .spinner-field {
      width: 100%;
      background-color: var(--color-secondary-btn);
      color: var(--color-text);
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 13px 12px;
      margin: 5px 0;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--color-red);
      color: var(--color-yellow);
      font-weight: 700;
      border: none;
      border-radius: 6px;
      padding: 13px 14px;
      margin: 6px 0;
      font-size: 13.5px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      text-align: center;
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .btn-secondary {
      width: 100%;
      background-color: var(--color-secondary-btn);
      color: var(--color-text);
      font-weight: 500;
      border: none;
      border-radius: 6px;
      padding: 12px 14px;
      margin: 4px 0;
      font-size: 13.5px;
      cursor: pointer;
      text-align: center;
    }

    .btn-secondary:active {
      opacity: 0.85;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin: 4px 0;
    }

    .btn-row > button {
      flex: 1;
    }

    /* Grid Menu 1:1 identik dengan createSquareGridMenu di Android */
    .square-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 14px;
      width: 100%;
    }

    .square-tile {
      aspect-ratio: 1 / 1;
      background-color: var(--color-card);
      border: 2px solid var(--color-yellow);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.1s ease;
    }

    .square-tile:active {
      transform: scale(0.97);
    }

    .square-tile .tile-icon {
      font-size: 36px;
      line-height: 1.1;
    }

    .square-tile .tile-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text);
      margin-top: 12px;
      white-space: pre-line;
      line-height: 1.3;
    }

    /* Preview Foto Live Camera */
    .img-preview {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--color-yellow);
      display: none;
    }

    /* Toast Android Style */
    #toastBox {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(30, 41, 59, 0.96);
      color: var(--color-text);
      border: 1px solid var(--color-yellow);
      padding: 12px 22px;
      border-radius: 28px;
      font-size: 13.5px;
      z-index: 9999;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      max-width: 90%;
      text-align: center;
    }

    #toastBox.show {
      opacity: 1;
    }

    /* Modal Dialog Android AlertDialog + Live Camera Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 8888;
      padding: 18px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .dialog-box {
      background-color: var(--color-card);
      border: 1px solid var(--color-yellow);
      border-radius: 14px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dialog-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-yellow);
      margin-bottom: 6px;
    }

    .dialog-item {
      background-color: var(--color-bg);
      color: var(--color-text);
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      border: 1px solid #334155;
      text-align: left;
    }

    .dialog-item:hover {
      border-color: var(--color-yellow);
    }

    #cameraVideo {
      width: 100%;
      max-height: 55vh;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div id="rootContainer"></div>
  <div id="toastBox"></div>

  <!-- AlertDialog Pemilih Bukti Bayar / Nota (Persis showPhotoOrDocumentChooser di Android) -->
  <div id="chooserModal" class="modal-overlay">
    <div class="dialog-box">
      <div class="dialog-title">Pilih Sumber Bukti Bayar / Nota</div>
      <button class="dialog-item" id="optLiveCam">📸 Ambil Foto Langsung (Kamera)</button>
      <button class="dialog-item" id="optGallery">🖼️ Pilih Foto dari Galeri</button>
      <button class="dialog-item" id="optDocument">📄 Pilih File Dokumen (PDF / Gambar)</button>
      <button class="btn-secondary" id="optCancelChooser">Batal</button>
    </div>
  </div>

  <!-- Modal Kamera Langsung WebRTC + Fallback Native Camera -->
  <div id="liveCamModal" class="modal-overlay">
    <div class="dialog-box">
      <div class="dialog-title" id="liveCamTitle">📸 Kamera Langsung HMSI</div>
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="btn-row">
        <button class="btn-primary" id="btnSnapPhoto">📸 AMBIL FOTO</button>
        <button class="btn-secondary" id="btnSwitchCam">🔄 Putar Kamera</button>
      </div>
      <button class="btn-secondary" id="btnCloseCam">Batal</button>
    </div>
  </div>

  <!-- Hidden File Inputs untuk Galeri, Kamera Native HP, & Dokumen PDF -->
  <input type="file" id="inputGallery" accept="image/*" style="display:none" />
  <input type="file" id="inputNativeCamera" accept="image/*" capture="environment" style="display:none" />
  <input type="file" id="inputDocument" accept="application/pdf,image/*" style="display:none" />

  <script>
    // =========================================================================
    // KONFIGURASI API SERVICE (100% SAMA DENGAN ApiService.kt)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_-KyiVUQZRafseAPewLd4dwY08EJHl2aCC2l-oECBtd0UWZPYsLnZSm0x1IZRZD77/exec";

    const ApiService = {
      post: async function(payload, callback) {
        try {
          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload),
            redirect: "follow"
          });
          const text = await response.text();
          const jsonRes = JSON.parse(text);
          callback(jsonRes);
        } catch (err) {
          callback({
            status: "error",
            message: "Koneksi gagal: " + (err.message || "Periksa jaringan internet")
          });
        }
      }
    };

    // =========================================================================
    // STATE PENGGUNA & DATA LIVE GOOGLE SHEETS (100% SAMA DENGAN MainActivity.kt)
    // =========================================================================
    const COLOR_BG = "#0F172A";
    const COLOR_CARD = "#1E293B";
    const COLOR_RED = "#DC2626";
    const COLOR_YELLOW = "#EAB308";
    const COLOR_TEXT = "#F8FAFC";
    const COLOR_MUTED = "#94A3B8";
    const COLOR_GREEN = "#16A34A";

    let currentScreenState = "LOGIN";

    let currentUserId = "";
    let currentUserName = "";
    let currentUserUsername = "";
    let currentUserRole = "";
    let currentUserDivisi = "";

    let startingBalance = 0;
    let startingBalanceHistoryList = [];
    let endingBalance = 0;
    let qrisUrl = "";
    let bankAccountsList = [];

    let transactionsList = [];
    let uangKasList = [];
    let jadwalPiketList = [];
    let absenPiketList = [];
    let dendaList = [];
    let usersList = [];

    let currentGpsCoordinates = "-6.22970, 106.92420 (Sekretariat HMSI)";

    const monthsList = [
      "Oktober", "November", "Desember", "Januari", "Februari", "Maret",
      "April", "Mei", "Juni", "Juli", "Agustus", "September"
    ];

    const rootContainer = document.getElementById("rootContainer");

    // Inisialisasi GPS Lokasi & Navigasi Back
    window.addEventListener("DOMContentLoaded", () => {
      requestNecessaryPermissions();
      setupBackNavigationHandler();
      showLoginScreen();
    });

    function requestNecessaryPermissions() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);
            currentGpsCoordinates = `${lat}, ${lng} (Sekretariat HMSI)`;
          },
          () => {
            currentGpsCoordinates = "-6.22970, 106.92420 (Sekretariat HMSI)";
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    }

    function setupBackNavigationHandler() {
      window.history.replaceState({ screen: "LOGIN" }, "");
      window.addEventListener("popstate", () => {
        if (currentScreenState.startsWith("ACC_SUB_")) {
          showAccountingHubScreen(false);
        } else if (["ACCOUNTING_HUB", "UANG_KAS", "JADWAL_PIKET", "ABSEN_PIKET", "DENDA", "USER_SETTING"].includes(currentScreenState)) {
          showDashboardScreen(false);
        } else if (currentScreenState === "DASHBOARD") {
          toast("Tekan tombol Keluar (Logout) jika ingin berganti akun, atau tutup aplikasi.");
          window.history.pushState({ screen: "DASHBOARD" }, "");
        }
      });
    }

    function setScreenState(newState, pushHistory = true) {
      currentScreenState = newState;
      if (pushHistory) {
        window.history.pushState({ screen: newState }, "");
      }
      window.scrollTo(0, 0);
    }

    // =========================================================================
    // 1. LAYAR LOGIN
    // =========================================================================
    function showLoginScreen() {
      setScreenState("LOGIN", false);
      rootContainer.innerHTML = "";

      const container = document.createElement("div");
      container.className = "login-wrapper";

      const logoTitle = document.createElement("div");
      logoTitle.style.fontSize = "30px";
      logoTitle.style.fontWeight = "bold";
      logoTitle.style.color = COLOR_YELLOW;
      logoTitle.style.textAlign = "center";
      logoTitle.style.whiteSpace = "pre-line";
      logoTitle.textContent = "🏛️\nHMSI APP";

      const subTitle = document.createElement("div");
      subTitle.style.fontSize = "14px";
      subTitle.style.color = COLOR_MUTED;
      subTitle.style.textAlign = "center";
      subTitle.style.padding = "12px 0 36px 0";
      subTitle.style.whiteSpace = "pre-line";
      subTitle.textContent = "Sistem Informasi Manajemen & Keuangan\nHimpunan Mahasiswa Sistem Informasi";

      const card = createCardLayout();
      const etUser = createInput("Masukkan Username");
      const etPass = createInput("Masukkan Password", true, false);

      const btnLogin = createPrimaryButton("MASUK KE SISTEM", () => {
        const u = etUser.value.trim();
        const p = etPass.value.trim();
        if (!u || !p) {
          toast("Isi Username dan Password terlebih dahulu!");
          return;
        }
        toast("Menghubungkan ke Google Sheets HMSI...");
        const req = {
          action: "login",
          username: u,
          password: p
        };
        ApiService.post(req, (res) => {
          if (res.status === "success" && res.user) {
            const userObj = res.user;
            currentUserId = optSmart(userObj, "id", "id_user");
            currentUserName = optSmart(userObj, "nama", "name");
            const uname = optSmart(userObj, "username", "user");
            currentUserUsername = uname ? uname : u;
            currentUserRole = optSmart(userObj, "role", "status");
            currentUserDivisi = optSmart(userObj, "divisi", "divisi_jabatan");
            refreshAllDataAndShow(() => showDashboardScreen());
          } else {
            toast(res.message || "Gagal Login");
          }
        });
      });

      card.appendChild(etUser);
      card.appendChild(etPass);
      card.appendChild(btnLogin);

      container.appendChild(logoTitle);
      container.appendChild(subTitle);
      container.appendChild(card);
      rootContainer.appendChild(container);
    }

    function refreshAllDataAndShow(onDone) {
      ApiService.post({ action: "getDashboardData" }, (res) => {
        if (res.status === "success") {
          startingBalance = Number(res.startingBalance || 0);
          startingBalanceHistoryList = Array.isArray(res.startingBalanceHistory) ? res.startingBalanceHistory : [];
          endingBalance = Number(res.endingBalance || 0);
          qrisUrl = res.qrisUrl || "";
          bankAccountsList = Array.isArray(res.bankAccounts) ? res.bankAccounts : [];
          transactionsList = Array.isArray(res.transactions) ? res.transactions : [];
          uangKasList = Array.isArray(res.uangKas) ? res.uangKas : [];
          jadwalPiketList = Array.isArray(res.jadwalPiket) ? res.jadwalPiket : [];
          absenPiketList = Array.isArray(res.absenPiket) ? res.absenPiket : [];
          dendaList = Array.isArray(res.denda) ? res.denda : [];
          usersList = Array.isArray(res.users) ? res.users : [];
        } else {
          toast("Gagal memuat data terbaru: " + (res.message || ""));
        }
        if (onDone) onDone();
      });
    }

    // =========================================================================
    // 2. LAYAR DASHBOARD UTAMA (KOTAK GRID 1:1 DENGAN LOGO & NAMA MENU)
    // =========================================================================
    function showDashboardScreen(pushHistory = true) {
      setScreenState("DASHBOARD", pushHistory);
      rootContainer.innerHTML = "";

      const headerCard = createCardLayout();
      headerCard.appendChild(createLabel(`Halo, ${currentUserName} (@${currentUserUsername}) 👋`, 19, COLOR_YELLOW, true));
      headerCard.appendChild(createLabel(`${currentUserRole} • ${currentUserDivisi}`, 13, COLOR_MUTED, false));
      rootContainer.appendChild(headerCard);

      const balanceCard = createCardLayout(COLOR_RED);
      balanceCard.appendChild(createLabel("SALDO KAS ORGANISASI HMSI (LIVE)", 12, COLOR_YELLOW, true));
      balanceCard.appendChild(createLabel(`Starting Balance: ${formatRupiah(startingBalance)}`, 14, COLOR_TEXT, false));
      balanceCard.appendChild(createLabel(`Ending Balance: ${formatRupiah(endingBalance)}`, 24, COLOR_YELLOW, true));
      rootContainer.appendChild(balanceCard);

      const lblPilih = createLabel("PILIH MENU UTAMA", 15, COLOR_YELLOW, true);
      lblPilih.style.padding = "6px 2px 10px 2px";
      rootContainer.appendChild(lblPilih);

      const menuItems = [];
      if (["Bendahara", "Ketua Organisasi", "Wakahim", "Super Admin"].includes(currentUserRole)) {
        menuItems.push(["📊", "Accounting", () => showAccountingHubScreen()]);
      }
      menuItems.push(["💵", "Uang Kas", () => showUangKasScreen()]);

      if (["Super Admin", "Ketua Organisasi", "Wakahim"].includes(currentUserRole)) {
        menuItems.push(["📅", "Kelola Jadwal\nPiket", () => showKelolaJadwalPiketScreen()]);
      }
      menuItems.push(["📸", "Absen Piket\n(Live Cam)", () => showAbsenPiketScreen()]);
      menuItems.push(["⚠️", "Menu Denda\n(Rp 20.000)", () => showDendaScreen()]);

      if (["Super Admin", "Bendahara"].includes(currentUserRole)) {
        menuItems.push(["⚙️", "User Setting\n& Password", () => showUserSettingScreen()]);
      }

      rootContainer.appendChild(createSquareGridMenu(menuItems));

      rootContainer.appendChild(createSecondaryButton("🔄 Sinkronisasi Data Google Sheets", () => {
        toast("Menyinkronkan data...");
        refreshAllDataAndShow(() => showDashboardScreen(false));
      }));
      rootContainer.appendChild(createSecondaryButton("🚪 Keluar Akun (Logout)", () => showLoginScreen()));
    }

    // =========================================================================
    // 3. HUB MODUL ACCOUNTING (DIBAGI MENJADI 6 ANAK MENU KOTAK 1:1)
    // =========================================================================
    function showAccountingHubScreen(pushHistory = true) {
      setScreenState("ACCOUNTING_HUB", pushHistory);
      rootContainer.innerHTML = "";

      rootContainer.appendChild(createSecondaryButton("← Kembali ke Dashboard", () => showDashboardScreen()));
      rootContainer.appendChild(createLabel("MODUL ACCOUNTING HMSI", 22, COLOR_YELLOW, true));
      rootContainer.appendChild(createLabel("Pilih sub-menu di bawah agar tampilan fokus satu per satu:", 13, COLOR_MUTED, false));

      const summaryCard = createCardLayout(COLOR_RED);
      summaryCard.appendChild(createLabel(`Starting Balance: ${formatRupiah(startingBalance)}`, 14, COLOR_TEXT, false));
      summaryCard.appendChild(createLabel(`Ending Balance: ${formatRupiah(endingBalance)}`, 22, COLOR_YELLOW, true));
      rootContainer.appendChild(summaryCard);

      const subMenus = [
        ["💰", "Kelola Saldo\nAwal & Riwayat", () => showAccSubStartingBalance()],
        ["🧾", "Buat Invoice /\nPengeluaran", () => showAccSubInputExpense()],
        ["✅", "Verifikasi Kas\n& Denda", () => showAccSubVerification()],
        ["📋", "Cek Status Kas\nAnggota", () => showAccSubMemberKasStatus()],
        ["🏦", "Atur QRIS &\nRekening Bank", () => showAccSubPaymentSettings()],
        ["📄", "Buku Kas &\nExport PDF", () => showAccSubLedgerAndPdf()]
      ];

      rootContainer.appendChild(createSquareGridMenu(subMenus));
    }

    // -------------------------------------------------------------------------
    // ANAK MENU ACCOUNTING 3A: KELOLA STARTING BALANCE + RIWAYAT & TANGGALNYA
    // -------------------------------------------------------------------------
    function showAccSubStartingBalance() {
      setScreenState("ACC_SUB_STARTING");
      rootContainer.innerHTML = "";

      rootContainer.appendChild(createSecondaryButton("← Kembali ke Menu Accounting", () => showAccountingHubScreen()));
      rootContainer.appendChild(createLabel("KELOLA STARTING BALANCE", 20, COLOR_YELLOW, true));

      const infoCard = createCardLayout(COLOR_RED);
      infoCard.appendChild(createLabel("Starting Balance Saat Ini (Live GSheet):", 13, COLOR_TEXT, false));
      infoCard.appendChild(createLabel(formatRupiah(startingBalance), 24, COLOR_YELLOW, true));
      infoCard.appendChild(createLabel(`Ending Balance Berjalan: ${formatRupiah(endingBalance)}`, 14, COLOR_TEXT, false));
      rootContainer.appendChild(infoCard);

      const isEditor = ["Bendahara", "Super Admin"].includes(currentUserRole);
      if (!isEditor) {
        rootContainer.appendChild(createLabel("Hanya Bendahara / Super Admin yang dapat mengubah Starting Balance.", 14, COLOR_MUTED, false));
      } else {
        const setCard = createCardLayout();
        setCard.appendChild(createLabel("1. Tetapkan Nilai Starting Balance Baru", 16, COLOR_YELLOW, true));
        const etSet = createInput("Masukkan nominal Starting Balance (Rp)", false, true);
        etSet.value = String(startingBalance);
        const btnSet = createPrimaryButton("SIMPAN STARTING BALANCE UTAMA", () => {
          const v = etSet.value.trim();
          if (!v) {
            toast("Nominal tidak boleh kosong!");
            return;
          }
          ApiService.post({
            action: "manageStartingBalance",
            mode: "SET",
            amount: v,
            updatedBy: currentUserName
          }, (res) => {
            toast(res.message || "Berhasil disimpan");
            refreshAllDataAndShow(() => showAccSubStartingBalance());
          });
        });
        setCard.appendChild(etSet);
        setCard.appendChild(btnSet);
        rootContainer.appendChild(setCard);

        const addCard = createCardLayout();
        addCard.appendChild(createLabel("2. Tambah Dana ke Starting Balance (+)", 16, COLOR_YELLOW, true));
        const etAdd = createInput("Nominal tambahan ke Starting Balance (Rp)", false, true);
        const btnAdd = createPrimaryButton("+ TAMBAHKAN KE STARTING BALANCE", () => {
          const v = etAdd.value.trim();
          if (!v) {
            toast("Masukkan nominal tambahan terlebih dahulu!");
            return;
          }
          ApiService.post({
            action: "manageStartingBalance",
            mode: "ADD",
            amount: v,
            updatedBy: currentUserName
          }, (res) => {
            toast(res.message || "Berhasil ditambahkan");
            refreshAllDataAndShow(() => showAccSubStartingBalance());
          });
        });
        addCard.appendChild(etAdd);
        addCard.appendChild(btnAdd);
        rootContainer.appendChild(addCard);
      }

      const historyCard = createCardLayout();
      historyCard.appendChild(createLabel("📜 Riwayat Perubahan Starting Balance Sebelumnya", 17, COLOR_YELLOW, true));
      if (startingBalanceHistoryList.length === 0) {
        historyCard.appendChild(createLabel("Belum ada riwayat perubahan Starting Balance yang tercatat.", 13, COLOR_MUTED, false));
      } else {
        startingBalanceHistoryList.forEach((h) => {
          const tgl = h.tanggal || "-";
          const mode = h.mode || "Update";
          const prevBal = Number(h.previousBalance || 0);
          const inpAmt = Number(h.inputAmount || 0);
          const newBal = Number(h.newBalance || 0);
          const by = h.updatedBy || "Bendahara";

          const itemBox = document.createElement("div");
          itemBox.className = "item-box";
          itemBox.appendChild(createLabel(`📅 Tanggal: ${tgl} (${by})`, 13, COLOR_YELLOW, true));
          itemBox.appendChild(createLabel(`Aksi: ${mode} (${formatRupiah(inpAmt)})`, 13, COLOR_TEXT, false));
          itemBox.appendChild(createLabel(`Saldo Awal Sebelumnya: ${formatRupiah(prevBal)} ➔ Menjadi: ${formatRupiah(newBal)}`, 13, COLOR_GREEN, true));
          historyCard.appendChild(itemBox);

    function createVerificationRow(targetType, targetId, title, buktiUrl) {
      const box = document.createElement("div");
      box.appendChild(createLabel(title, 15, COLOR_TEXT, true));
      if (buktiUrl && buktiUrl.startsWith("http")) {
        box.appendChild(createSecondaryButton("🔍 Lihat Bukti Transfer", () => {
          window.open(buktiUrl, "_blank");
        }));
      }
      const btnRow = document.createElement("div");
      btnRow.className = "btn-row";
      const btnApprove = createPrimaryButton("✔ SETUJUI", () => submitVerification(targetType, targetId, "APPROVE"));
      const btnDecline = createSecondaryButton("✖ TOLAK", () => submitVerification(targetType, targetId, "DECLINE"));
      btnRow.appendChild(btnApprove);
      btnRow.appendChild(btnDecline);
      box.appendChild(btnRow);
      return box;
    }

    function submitVerification(targetType, targetId, decision) {
      ApiService.post({
        action: "verifyPayment",
        targetType: targetType,
        targetId: targetId,
        decision: decision,
        verifiedBy: currentUserName
      }, (res) => {
        toast(res.message || "Verifikasi berhasil");
        refreshAllDataAndShow(() => showAccSubVerification());
      });
    }

    function showAccSubMemberKasStatus() {
      setScreenState("ACC_SUB_MEMBER_KAS");
      rootContainer.innerHTML = "";

      rootContainer.appendChild(createSecondaryButton("← Kembali ke Menu Accounting", () => showAccountingHubScreen()));
      rootContainer.appendChild(createLabel("CEK STATUS KAS ANGGOTA", 20, COLOR_YELLOW, true));
      rootContainer.appendChild(createLabel("Membandingkan daftar seluruh anggota di tab Users dengan pembayaran kas per bulan:", 13, COLOR_MUTED, false));

      const filterCard = createCardLayout();
      filterCard.appendChild(createLabel("Pilih Bulan Pemeriksaan:", 14, COLOR_YELLOW, true));
      const spMonth = createSpinner(monthsList);
      const resultBox = document.createElement("div");

      function renderChecklist(month) {
        resultBox.innerHTML = "";
        const paidList = [];
        const pendingList = [];
        const unpaidList = [];

        usersList.forEach((u) => {
          const uid = getUserIdSmart(u);
          const uname = getUserNameSmart(u);
          const udiv = getUserDivisiSmart(u);

          let foundStatus = "BELUM BAYAR";
          for (let kIdx = 0; kIdx < uangKasList.length; kIdx++) {
            const k = uangKasList[kIdx];
            const kUid = optSmart(k, "ID_User", "id_user");
            const kName = optSmart(k, "Nama", "nama");
            const kMonth = optSmart(k, "Bulan", "bulan");
            if ((kUid.toLowerCase() === uid.toLowerCase() || kName.toLowerCase() === uname.toLowerCase()) && kMonth.toLowerCase() === month.toLowerCase()) {
              foundStatus = optSmart(k, "Status", "status") || "Pending";
              break;
            }
          }

          if (foundStatus.toLowerCase().includes("approved")) {
            paidList.push(`✔ ${uname} (${udiv}) — LUNAS`);
          } else if (foundStatus.toLowerCase().includes("pending")) {
            pendingList.push(`⏳ ${uname} (${udiv}) — PENDING VERIFIKASI`);
          } else if (foundStatus.toLowerCase().includes("declined")) {
            unpaidList.push(`❌ ${uname} (${udiv}) — DITOLAK (Wajib Upload Ulang)`);
          } else {
            unpaidList.push(`❗ ${uname} (${udiv}) — BELUM BAYAR`);
          }
        });

        const hPaid = createLabel(`SUDAH BAYAR / LUNAS (${paidList.length} Orang)`, 15, COLOR_GREEN, true);
        hPaid.style.paddingTop = "12px";
        resultBox.appendChild(hPaid);
        if (paidList.length === 0) resultBox.appendChild(createLabel(`- Belum ada yang lunas di bulan ${month}`, 13, COLOR_MUTED, false));
        paidList.forEach((t) => resultBox.appendChild(createLabel(t, 13, COLOR_TEXT, false)));

        const hPend = createLabel(`MENUNGGU VERIFIKASI (${pendingList.length} Orang)`, 15, COLOR_YELLOW, true);
        hPend.style.paddingTop = "14px";
        resultBox.appendChild(hPend);
        if (pendingList.length === 0) resultBox.appendChild(createLabel("- Tidak ada antrean pending", 13, COLOR_MUTED, false));
        pendingList.forEach((t) => resultBox.appendChild(createLabel(t, 13, COLOR_YELLOW, false)));

        const hUnpaid = createLabel(`BELUM BAYAR / DITOLAK (${unpaidList.length} Orang)`, 15, COLOR_RED, true);
        hUnpaid.style.paddingTop = "14px";
        resultBox.appendChild(hUnpaid);
        if (unpaidList.length === 0) resultBox.appendChild(createLabel("🎉 Semua anggota sudah bayar!", 13, COLOR_GREEN, false));
        unpaidList.forEach((t) => resultBox.appendChild(createLabel(t, 13, COLOR_TEXT, false)));
      }

      spMonth.addEventListener("change", () => renderChecklist(spMonth.value));
      filterCard.appendChild(spMonth);
      filterCard.appendChild(resultBox);
      rootContainer.appendChild(filterCard);
      renderChecklist(monthsList[0]);
    }

    async function openLiveCameraModal(withWatermark, onCaptured) {
      requestNecessaryPermissions();
      const modal = document.getElementById("liveCamModal");
      const video = document.getElementById("cameraVideo");

      async function startStream() {
        if (activeStream) {
          activeStream.getTracks().forEach((t) => t.stop());
        }
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode },
            audio: false
          });
          video.srcObject = activeStream;
          modal.classList.add("active");
        } catch (err) {
          // Fallback ke Native Camera Input jika izin webcam browser ditolak
          const inpCam = document.getElementById("inputNativeCamera");
          inpCam.value = "";
          inpCam.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            imageFileToBase64(file, withWatermark, (dataUrl, b64) => onCaptured(dataUrl, b64));
          };
          inpCam.click();
        }
      }

      function stopAndClose() {
        if (activeStream) {
          activeStream.getTracks().forEach((t) => t.stop());
          activeStream = null;
        }
        modal.classList.remove("active");
      }

      document.getElementById("btnSwitchCam").onclick = () => {
        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
        startStream();
      };

      document.getElementById("btnCloseCam").onclick = stopAndClose;

      document.getElementById("btnSnapPhoto").onclick = () => {
        const canvas = document.createElement("canvas");
        const rawW = video.videoWidth || 720;
        const rawH = video.videoHeight || 960;
        canvas.width = rawW;
        canvas.height = rawH;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, rawW, rawH);
        stopAndClose();

        const finalCanvas = withWatermark ? stampWatermarkOnCanvas(canvas) : canvas;
        const dataUrl = finalCanvas.toDataURL("image/jpeg", 0.85);
        const b64 = dataUrl.split(",")[1];
        onCaptured(dataUrl, b64);
      };

      await startStream();
    }

    function imageFileToBase64(file, withWatermark, callback) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          const finalCanvas = withWatermark ? stampWatermarkOnCanvas(canvas) : canvas;
          const dataUrl = finalCanvas.toDataURL("image/jpeg", 0.85);
          const b64 = dataUrl.split(",")[1];
          callback(dataUrl, b64);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    /**
     * Menempelkan Watermark Tanggal Live, Jam Live (WIB), dan Lokasi GPS persis seperti stampWatermarkOnBitmap di Android
     */
    function stampWatermarkOnCanvas(srcCanvas) {
      const targetWidth = Math.max(srcCanvas.width, 720);
      const scaleRatio = targetWidth / srcCanvas.width;
      const targetHeight = Math.round(srcCanvas.height * scaleRatio);

      const outCanvas = document.createElement("canvas");
      outCanvas.width = targetWidth;
      outCanvas.height = targetHeight;
      const ctx = outCanvas.getContext("2d");

      ctx.drawImage(srcCanvas, 0, 0, targetWidth, targetHeight);

      const bannerHeight = Math.max(Math.round(targetHeight * 0.24), 130);
      const bannerTop = targetHeight - bannerHeight;

      ctx.fillStyle = "rgba(15, 23, 42, 0.84)";
      ctx.fillRect(0, bannerTop, targetWidth, bannerHeight);

      ctx.strokeStyle = COLOR_RED;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(0, bannerTop);
      ctx.lineTo(targetWidth, bannerTop);
      ctx.stroke();

      const now = new Date();
      const liveDate = now.toLocaleDateString("id-ID", {
        weekday: "long",
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
      const liveTime = now.toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).replace(/\./g, ":") + " WIB";

      const gps = getCurrentGpsString();
      const userTag = currentUserUsername || currentUserName;

      ctx.font = "bold 24px Roboto, sans-serif";
      ctx.fillStyle = COLOR_YELLOW;
      ctx.fillText(`HMSI LIVE PIKET — @${userTag}`, 20, bannerTop + 36);

      ctx.font = "bold 20px Roboto, sans-serif";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(`Tanggal & Jam: ${liveDate} | ${liveTime}`, 20, bannerTop + 70);
      ctx.fillText(`Lokasi GPS: ${gps}`, 20, bannerTop + 104);

      return outCanvas;
    }

    function getCurrentGpsString() {
      return currentGpsCoordinates || "-6.22970, 106.92420 (Sekretariat HMSI)";
    }

    // =========================================================================
    // HELPER PINTAR CASE-INSENSITIVE & NORMALISASI TANGGAL (100% SAMA DENGAN ANDROID)
    // =========================================================================
    function optSmart(obj, ...candidates) {
      if (!obj || typeof obj !== "object") return "";
      for (const c of candidates) {
        if (obj[c] !== undefined && obj[c] !== null) {
          const v = String(obj[c]).trim();
          if (v !== "" && v !== "null") return v;
        }
      }
      const keys = Object.keys(obj);
      for (const c of candidates) {
        const matchedKey = keys.find((k) => k.trim().toLowerCase() === c.trim().toLowerCase());
        if (matchedKey !== undefined) {
          const v = String(obj[matchedKey]).trim();
          if (v !== "" && v !== "null") return v;
        }
      }
      return "";
    }

    function normalizeDateString(raw) {
      const s = String(raw || "").trim();
      if (!s) return "";
      if (s.includes("T") && s.endsWith("Z")) {
        try {
          const parsed = new Date(s);
          if (!isNaN(parsed.getTime())) {
            const wibTime = new Date(parsed.getTime() + 7 * 60 * 60 * 1000);
            return wibTime.toISOString().substring(0, 10);
          }
        } catch (e) {}
      }
      const match = s.match(/(\d{4}-\d{2}-\d{2})/);
      if (match) return match[1];
      return s.substring(0, 10);
    }

    function normalizeMonthString(rawMonth, normalizedDate) {
      if (normalizedDate && normalizedDate.length >= 7 && normalizedDate[4] === "-") {
        return normalizedDate.substring(0, 7);
      }
      const s = String(rawMonth || "").trim();
      const match = s.match(/(\d{4}-\d{2})/);
      if (match) return match[1];
      return "";
    }

    function getUserIdSmart(u) {
      const v = optSmart(u, "ID_User", "id_user", "ID", "id", "No", "NO");
      if (v) return v;
      const keys = Object.keys(u || {});
      return keys.length > 0 ? String(u[keys[0]]).trim() : "-";
    }

    function getUserNameSmart(u) {
      const v = optSmart(u, "Nama", "nama", "NAMA", "Name", "Username", "username");
      if (v) return v;
      const keys = Object.keys(u || {});
      return keys.length > 1 ? String(u[keys[1]] || "Anggota HMSI").trim() : "Anggota HMSI";
    }

    function getUserDivisiSmart(u) {
      const v = optSmart(u, "Divisi_Jabatan", "divisi_jabatan", "Jabatan/Divisi", "Divisi", "divisi", "Jabatan", "Role", "role");
      return v || "Pengurus HMSI";
    }

    function getUserRoleSmart(u) {
      return optSmart(u, "Role", "role", "ROLE", "Status_Akun") || "User Biasa";
    }

    function getUsernameSmart(u) {
      return optSmart(u, "Username", "username", "USERNAME") || getUserNameSmart(u).toLowerCase().replace(/\s+/g, "");
    }

    function getOldPassSmart(u) {
      return optSmart(u, "Password_Lama", "password_lama", "Password_Aktif", "password_aktif") || "hmsi123";
    }

    function getActivePassSmart(u) {
      return optSmart(u, "Password_Aktif", "password_aktif", "Password", "password") || "hmsi123";
    }

    function getTodayFormatted() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    // =========================================================================
    // HELPER UI BUILDER (IDENTIK DENGAN FUNGSI HELPER DI MainActivity.kt)
    // =========================================================================
    function createSquareGridMenu(items) {
      const grid = document.createElement("div");
      grid.className = "square-grid";
      items.forEach(([iconEmoji, title, onClick]) => {
        const tile = document.createElement("div");
        tile.className = "square-tile";
        tile.onclick = onClick;

        const tvIcon = document.createElement("div");
        tvIcon.className = "tile-icon";
        tvIcon.textContent = iconEmoji;

        const tvTitle = document.createElement("div");
        tvTitle.className = "tile-title";
        tvTitle.textContent = title;

        tile.appendChild(tvIcon);
        tile.appendChild(tvTitle);
        grid.appendChild(tile);
      });
      return grid;
    }

    function createCardLayout(bgColor = COLOR_CARD) {
      const card = document.createElement("div");
      card.className = "card";
      card.style.backgroundColor = bgColor;
      return card;
    }

    function createLabel(txt, sizePx, color, isBold) {
      const tv = document.createElement("div");
      tv.className = "label";
      tv.textContent = txt;
      tv.style.fontSize = sizePx + "px";
      tv.style.color = color;
      if (isBold) tv.style.fontWeight = "700";
      return tv;
    }

    function createInput(hintText, isPassword = false, isNumber = false) {
      const et = document.createElement("input");
      et.className = "input-field";
      et.placeholder = hintText;
      et.type = isPassword ? "password" : isNumber ? "number" : "text";
      return et;
    }

    function createSpinner(items) {
      const sp = document.createElement("select");
      sp.className = "spinner-field";
      items.forEach((item) => {
        const opt = document.createElement("option");
        opt.value = item;
        opt.textContent = item;
        sp.appendChild(opt);
      });
      return sp;
    }

    function createPrimaryButton(label, onClick) {
      const btn = document.createElement("button");
      btn.className = "btn-primary";
      btn.textContent = label;
      btn.onclick = onClick;
      return btn;
    }

    function createSecondaryButton(label, onClick) {
      const btn = document.createElement("button");
      btn.className = "btn-secondary";
      btn.textContent = label;
      btn.onclick = onClick;
      return btn;
    }

    function formatRupiah(amount) {
      const num = Number(amount) || 0;
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(num);
    }

    let toastTimer = null;
    function toast(msg) {
      if (!msg) return;
      const box = document.getElementById("toastBox");
      box.textContent = msg;
      box.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove("show");
      }, 2800);
    }
  </script>
</body>
</html>
